# =====================================================================
# 1. SERVER & AUTHENTICATION CONFIGURATION
# =====================================================================
# Point to your local SonarQube Docker container instance
sonar.host.url=http://localhost:9000

# Your SonarQube Analysis Token (Generated in User > My Account > Security)
# Note: It is best practice to pass this via an environment variable (SONAR_TOKEN) 
# instead of hardcoding it here if your repo is shared.
sonar.token=your_actual_sonar_token_here

# =====================================================================
# 2. REQUIRED CORE METADATA
# =====================================================================
# Unique identifier for this project across your SonarQube instance
sonar.projectKey=ai-automation-backend

# The display name and version history inside the SonarQube UI dashboard
sonar.projectName=AI Automation Backend
sonar.projectVersion=1.0.0-SNAPSHOT

# Character encoding of the source files
sonar.sourceEncoding=UTF-8

# =====================================================================
# 3. ANALYSIS SCOPE (INCLUSIONS / EXCLUSIONS)
# =====================================================================
# Tell SonarQube exactly where your application logic lives (comma-separated)
sonar.sources=src, app/core

# Tell SonarQube where your automated test code lives
sonar.tests=tests, src/test

# Files to completely ignore during the quality scan
sonar.exclusions=**/node_modules/**, **/dist/**, **/build/**, **/*.config.js, **/public/assets/**

# Files to scan but skip tracking for code coverage percentages (e.g., UI stories, mocks)
sonar.coverage.exclusions=**/*.stories.tsx, **/mocks/**, src/main.ts

# Files to exclude specifically from code duplication check calculations
sonar.cpd.exclusions=**/*.dto.ts, **/models/**

# =====================================================================
# 4. ADVANCED LANGUAGE-SPECIFIC LOGS & COVERAGE REPORTS
# =====================================================================
# JavaScript / TypeScript Configuration
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Python Configuration
sonar.python.coverage.reportPaths=coverage/coverage.xml

# Java Configuration (Required if your project compiles Java)
sonar.java.binaries=target/classes, build/classes/java/main
sonar.java.coveragePlugin=jacoco
sonar.jacoco.reportPaths=target/jacoco.exec

# C# / .NET Configuration
# sonar.cs.opencover.reportsPaths=coverage.opencover.xml

# =====================================================================
# 5. CONTROLLING LOG VERBOSITY
# =====================================================================
# Turn on detailed logging (DEBUG or INFO). Highly useful for troubleshooting Docker container paths.
sonar.log.level=DEBUG
sonar.verbose=true
